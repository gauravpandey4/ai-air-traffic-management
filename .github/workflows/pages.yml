name: Build and deploy GitHub Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore aircraft snapshot cooldown state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workflow-cache/aircraft-cooldown.json
          key: aircraft-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aircraft-snapshot-
      - name: Fetch one guarded regional aircraft snapshot
        run: npm run snapshot:aircraft
      - name: Save aircraft snapshot cooldown state
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .workflow-cache/aircraft-cooldown.json
          key: aircraft-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run quality checks
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_RELEASE_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
